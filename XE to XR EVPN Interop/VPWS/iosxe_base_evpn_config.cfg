!
! Begin EVPN global pararmeters 
!
l2vpn evpn
 router-id Loopback0
!
! End EVPN global pararmeters 
!

! Begin BGP Configuration - Peering with EVPN SAFI to the route reflector
!
router bgp 1
 bgp router-id 10.0.0.1
 address-family l2vpn evpn
!
neighbor-group rr
  remote-as 1
  update-source Loopback0
  address-family l2vpn evpn
  !
 !
 !!! RR = 10.255.255.5
 neighbor 10.255.255.5
  use neighbor-group rr
!
! End BGP Configuration
!
!