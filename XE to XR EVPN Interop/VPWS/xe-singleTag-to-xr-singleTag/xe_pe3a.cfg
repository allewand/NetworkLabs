!
! Begin attachment circuit (AC) interface / service instance configuration  
!
interface TenGigabitEthernet0/0/9
 description to 9500 Site2-CE2 Single Homed
 !
 service instance 3111 ethernet
  encapsulation dot1q 3111
  rewrite ingress tag pop 1 symmetric
!
!
! End attachment circuit (AC) interface / service instance configuration  
!

!
! Begin EVPN instance configuration 
!
l2vpn evpn instance 3111 point-to-point
 vpws context vpws3111
  service target 3111 source 3111
  member TenGigabitEthernet0/0/9 service-instance 3111
!
! End EVPN instance configuration 
!